/* ---------- responsive ---------- */
@media (max-width:980px){
  .globe{right:-8rem;top:-1rem;width:21rem;height:21rem;opacity:.4}
  .index-grid{grid-template-columns:repeat(2,1fr)}
  .skill-grid{grid-template-columns:repeat(2,1fr)}
  .skill.wide{grid-column:auto}
}
@media (max-width:860px){
  .contact{grid-template-columns:1fr;gap:2.6rem}
}
@media (max-width:760px){
  .menu-btn{display:inline-flex}
  .nav{display:none;position:absolute;top:100%;right:0;width:min(16rem,100%);background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .nav.open{display:block}
  .nav ul{flex-direction:column;gap:0;padding:.6rem 1.5rem 1rem}
  .nav a{padding:.8rem 0;border-bottom:1px solid var(--line)}
  .nav a::after{bottom:-1px;right:auto;width:1.2rem}
}
@media (max-width:700px){
  .sec-head{flex-direction:column;align-items:flex-start;gap:.6rem}
  .tl::before{left:.7rem}
  .tl-item{grid-template-columns:1.4rem 1fr}
  .tl-date{grid-column:2;grid-row:1;padding:0 0 .35rem}
  .tl-node{grid-column:1;grid-row:1;margin-top:.2rem}
  .tl-body{grid-column:2;grid-row:2}
  .proj{padding:1.5rem 1.3rem}
  .stamp{width:4.2rem;height:4.2rem;font-size:.52rem;top:.7rem;right:.7rem}
  .proj.has-stamp .proj-head{padding-right:4.6rem}
}
@media (max-width:560px){
  .hero{padding-top:3.4rem}
  .index-grid,.skill-grid{grid-template-columns:1fr}
  .row{padding:.9rem 1.1rem}
  .radar-card{gap:1.2rem;padding:1.2rem}
  .radar{width:7rem;height:7rem}
}
@media (max-width:370px){
  .radar-card{grid-template-columns:1fr;justify-items:start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="field" aria-hidden="true"></canvas>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" id="brand" href="#home"></a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Menu">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <nav class="nav" id="nav" aria-label="Main"><ul></ul></nav>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap foot-in"><span id="copy"></span><span id="foot-note"></span></div>
</footer>

<script>
(() => {
  "use strict";
  const D = DATA;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const joinList = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ARROW = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const exp = D.experience || [], edu = D.education || [], projects = D.projects || [], skills = D.skills || [];

  /* ---------- contact channels ---------- */
  const rows = [];
  if (D.email) rows.push({ label: "Email", value: D.email, href: "mailto:" + D.email });
  if (D.phone) rows.push({ label: "Phone", value: D.phone, href: "tel:" + D.phone.replace(/[^\d+]/g, "") });
  if (D.location) rows.push({ label: "Location", value: D.location, time: true });
  if (D.github) rows.push({ label: "GitHub", value: D.github.replace(/^https?:\/\/(www\.)?/, ""), href: D.github, ext: true });
  if (D.linkedin) rows.push({ label: "LinkedIn", value: D.linkedin.replace(/^https?:\/\/(www\.)?/, ""), href: D.linkedin, ext: true });

  const PAGES = [
    { id: "home", label: "Home", title: "Home" },
    { id: "experience", label: "Experience", title: "Experience", intro: D.intros.experience, count: `${pad(exp.length + edu.length)} entries`,
      blurb: [exp.length ? `${exp[0].role} at ${exp[0].company}.` : "", edu.length ? `${edu[0].company}.` : ""].join(" ").trim(), meta: `${pad(exp.length + edu.length)} entries →` },
    { id: "work", label: "Work", title: "Selected work", intro: D.intros.work, count: `${pad(projects.length)} projects`,
      blurb: joinList(projects.map(p => p.name)) + ".", meta: `${pad(projects.length)} projects →` },
    { id: "skills", label: "Skills", title: "Skills index", intro: D.intros.skills, count: `${pad(skills.length)} domains`,
      blurb: joinList(skills.slice(0, 4).map(s => s.domain)) + ".", meta: `${pad(skills.length)} domains →` },
    { id: "contact", label: "Contact", title: "Get in touch", intro: D.intros.contact, count: `${pad(rows.length)} channels`,
      blurb: "Email, phone and where I'm based.", meta: "Get in touch →" }
  ];

  /* ---------- helpers ---------- */
  const when = (s, e) => !s && !e ? "" : !e ? esc(s) : `${esc(s)} — ${/^present$/i.test(e) ? `<span class="now">${esc(e)}</span>` : esc(e)}`;
  const bullets = pts => pts && pts.length ? `<ul class="bul">${pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
  const head = i => {
    const p = PAGES[i];
    return `<header class="sec-head"><div>
      <p class="eyebrow"><span class="acc">${pad(i)}</span> / Section</p>
      <h2 tabindex="-1">${esc(p.title)}</h2>
      <p class="lede">${esc(p.intro)}</p></div>
      <p class="sec-count">${esc(p.count)}</p></header>`;
  };
  const pager = i => {
    const a = PAGES[i - 1], b = PAGES[i + 1];
    return `<nav class="pager" aria-label="Sections">
      ${a ? `<a class="prev" href="#${a.id}"><small>← Previous</small><span>${esc(a.title)}</span></a>` : ""}
      ${b ? `<a class="next" href="#${b.id}"><small>Next →</small><span>${esc(b.title)}</span></a>` : ""}</nav>`;
  };

  /* ---------- home ---------- */
  const tag0 = (D.taglines && D.taglines[0]) || "";
  const homeHTML = `
  <div class="wrap hero">
    <canvas class="globe" id="globe" aria-hidden="true"></canvas>
    <div class="hero-text">
      <p class="eyebrow">Dossier / ${esc(D.role)}</p>
      <h1 tabindex="-1">${esc(D.name)}</h1>
      <p class="tagline"><span class="sr">${esc((D.taglines || []).join(" "))}</span><span id="typed" aria-hidden="true">${esc(tag0)}</span><span class="cursor" aria-hidden="true"></span></p>
      <p class="bio">${esc(D.bio)}</p>
      <div class="actions">
        <a class="btn btn-primary" href="#work">View work <span class="arrow">${ARROW}</span></a>
        ${D.email ? `<a class="btn btn-light" href="mailto:${esc(D.email)}">Email me ›</a>` : ""}
      </div>
    </div>
    <div class="index">
      <p class="eyebrow">Index / ${pad(PAGES.length - 1)} sections</p>
      <div class="index-grid stagger">
        ${PAGES.slice(1).map((p, k) => `<a class="icard" style="--i:${k}" href="#${p.id}">
          <span class="num">${pad(k + 1)}</span><h3>${esc(p.title)}</h3>
          <p>${esc(p.blurb)}</p><span class="meta">${esc(p.meta)}</span></a>`).join("")}
      </div>
    </div>
  </div>`;

  /* ---------- experience + education ---------- */
  const tlItems = (arr, cls, off) => arr.map((x, k) => `
      <li class="tl-item" style="--i:${k + off}">
        <p class="tl-date">${when(x.start, x.end)}</p>
        <span class="tl-node ${cls}" aria-hidden="true"></span>
        <div class="tl-body">
          <h3>${esc(x.role)}</h3>
          <p class="org"><b>${esc(x.company)}</b>${x.location ? ` · ${esc(x.location)}` : ""}</p>
          ${bullets(x.points)}
        </div>
      </li>`).join("");
  const expHTML = `<div class="wrap sec">${head(1)}
    ${exp.length ? `<ol class="tl stagger">${tlItems(exp, "", 0)}</ol>` : ""}
    ${edu.length ? `<p class="eyebrow tl-sub">Education</p><ol class="tl tl-edu stagger">${tlItems(edu, "edu", exp.length)}</ol>` : ""}
    ${pager(1)}</div>`;

  /* ---------- work ---------- */
  const workHTML = `<div class="wrap sec">${head(2)}
    <div class="projects stagger">${projects.map((p, k) => `
      <article class="proj${p.stamp ? " has-stamp" : ""}" style="--i:${k}">
        ${p.stamp ? `<span class="stamp">${esc(p.stamp)}</span>` : ""}
        <div class="proj-head"><h3>${esc(p.name)}</h3>${when(p.start, p.end) ? `<p class="date">${when(p.start, p.end)}</p>` : ""}</div>
        ${p.tags && p.tags.length ? `<ul class="tags" aria-label="Tech used">${p.tags.map(t => `<li class="tag">${esc(t)}</li>`).join("")}</ul>` : ""}
        ${bullets(p.points)}
        ${p.link ? `<a class="proj-link" href="${esc(p.link)}" target="_blank" rel="noopener">View project ↗</a>` : ""}
      </article>`).join("")}
    </div>${pager(2)}</div>`;

  /* ---------- skills ---------- */
  const allSkills = skills.flatMap(s => s.items || []);
  let ribbonItems = [];
  while (allSkills.length && ribbonItems.length < 36) ribbonItems = ribbonItems.concat(allSkills);
  const track = items => {
    const half = items.map(t => `<span>${esc(t)}</span><span class="sep">•</span>`).join("");
    return `<div class="track">${half}${half}</div>`;
  };
  const r3 = skills.length % 3;   // keep the 3-column grid filled
  const isWide = k => (r3 === 2 && k === 0) || (r3 === 1 && skills.length > 3 && (k === 0 || k === skills.length - 1));
  const skillsHTML = `<div class="wrap sec">${head(3)}
    ${ribbonItems.length ? `<div class="ribbons" aria-hidden="true">
      <div class="band band-b">${track([...ribbonItems].reverse())}</div>
      <div class="band band-a">${track(ribbonItems)}</div></div>` : ""}
    <div class="skill-grid stagger">${skills.map((s, k) => `
      <section class="skill${isWide(k) ? " wide" : ""}" style="--i:${k}" aria-label="${esc(s.domain)}">
        <div class="skill-head"><span><span class="n">${pad(k + 1)}</span><b>${esc(s.domain)}</b></span><span class="c">${pad((s.items || []).length)}</span></div>
        <div class="chips">${(s.items || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </section>`).join("")}
    </div>${pager(3)}</div>`;

  /* ---------- contact ---------- */
  const deg = (v, p, n) => `${Math.abs(v).toFixed(2)}° ${v >= 0 ? p : n}`;
  const rowsHTML = rows.map((r, k) => {
    const inner = `<span><small>${esc(r.label)}</small><strong>${esc(r.value)}</strong></span>` +
      (r.time ? `<span class="time">${esc(D.tzLabel || "")} · <span id="clock">--:--</span></span>` : `<span class="go" aria-hidden="true">→</span>`);
    return r.href
      ? `<a class="row" style="--i:${k}" href="${esc(r.href)}"${r.ext ? ' target="_blank" rel="noopener"' : ""}>${inner}</a>`
      : `<div class="row" style="--i:${k}">${inner}</div>`;
  }).join("");
  const radarHTML = D.coords ? `
    <div class="radar-card" style="--i:${rows.length}">
      <div class="radar" aria-hidden="true"><span class="sweep"></span><span class="blip b1"></span><span class="blip b2"></span><span class="blip b3"></span><span class="ctr"></span></div>
      <dl class="stats">
        <div><dt>Lat</dt><dd>${deg(D.coords.lat, "N", "S")}</dd></div>
        <div><dt>Lon</dt><dd>${deg(D.coords.lon, "E", "W")}</dd></div>
        <div><dt>Signal</dt><dd class="acc">Online</dd></div>
        <div><dt>Reply</dt><dd>&lt; 24h</dd></div>
      </dl>
    </div>` : "";
  const contactHTML = `<div class="wrap sec">${head(4)}
    <div class="contact">
      <div>
        ${D.available ? `<span class="badge">${esc(D.available)}</span>` : ""}
        <p class="contact-text">${esc(D.contactText)}</p>
        <div class="actions">
          ${D.email ? `<a class="btn btn-primary" href="mailto:${esc(D.email)}">Email me <span class="arrow">${ARROW}</span></a>` : ""}
          <a class="btn btn-ghost" href="#work">Back to work</a>
        </div>
        ${D.replyNote ? `<p class="note">${esc(D.replyNote)}</p>` : ""}
      </div>
      <div class="rows stagger">${rowsHTML}${radarHTML}</div>
    </div>${pager(4)}</div>`;

  /* ---------- mount ---------- */
  const views = { home: homeHTML, experience: expHTML, work: workHTML, skills: skillsHTML, contact: contactHTML };
  $("#main").innerHTML = PAGES.map(p => `<section class="page" id="page-${p.id}" data-page="${p.id}" hidden>${views[p.id]}</section>`).join("");
  $("#brand").textContent = D.name.trim().split(/\s+/).join("·");
  $("#nav ul").innerHTML = PAGES.map(p => `<li><a href="#${p.id}" data-link="${p.id}">${esc(p.label)}</a></li>`).join("");
  $("#copy").textContent = `© ${new Date().getFullYear()} ${D.name}`;
  $("#foot-note").textContent = D.footerNote || "";
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", `${D.name} — ${D.role}. ${D.bio}`.slice(0, 160));

  /* ---------- mobile menu ---------- */
  const nav = $("#nav"), menuBtn = $("#menu-btn");
  const closeMenu = () => { nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); };
  menuBtn.addEventListener("click", () => {
    const open = !nav.classList.contains("open");
    nav.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", e => { if (!e.target.closest(".top")) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
  $(".skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });

  /* ---------- live clock ---------- */
  const tick = () => {
    const el = $("#clock"); if (!el) return;
    try { el.textContent = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: D.timezone }).format(new Date()); }
    catch (_) { el.textContent = ""; }
  };
  tick(); setInterval(tick, 20000);

  /* ---------- typewriter ---------- */
  (function typewriter() {
    const el = $("#typed"), lines = D.taglines || [];
    if (!el || reduce || !lines.length) return;
    let li = 0, ci = 0, del = false;
    el.textContent = "";
    (function step() {
      const full = lines[li];
      if (!del) {
        el.textContent = full.slice(0, ++ci);
        if (ci >= full.length) { if (lines.length === 1) return; del = true; return setTimeout(step, 2400); }
        return setTimeout(step, 50 + Math.random() * 45);
      }
      el.textContent = full.slice(0, --ci);
      if (ci <= 0) { del = false; li = (li + 1) % lines.length; return setTimeout(step, 380); }
      setTimeout(step, 26);
    })();
  })();

  /* ---------- background constellation ---------- */
  (function field() {
    const cv = $("#field"), ctx = cv.getContext("2d");
    let W = 0, H = 0, pts = [], last = 0;
    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(70, Math.round(W * H / 22000));
      pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .014, vy: (Math.random() - .5) * .014 }));
    };
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      const L = 130;
      ctx.lineWidth = .8;
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d2 = dx * dx + dy * dy;
        if (d2 < L * L) {
          ctx.strokeStyle = `rgba(140,156,172,${((1 - Math.sqrt(d2) / L) * .2).toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
        }
      }
      ctx.fillStyle = "rgba(150,166,182,.4)";
      for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2); ctx.fill(); }
    };
    const loop = now => {
      const dt = Math.min(50, now - (last || now)); last = now;
      for (const p of pts) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }
      draw(); requestAnimationFrame(loop);
    };
    resize(); addEventListener("resize", () => { resize(); if (reduce) draw(); });
    reduce ? draw() : requestAnimationFrame(loop);
  })();

  /* ---------- hero globe ---------- */
  const globe = (function makeGlobe(cv) {
    if (!cv) return null;
    const ctx = cv.getContext("2d");
    const N = 160, P = [], ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i + .5) / N * 2, r = Math.sqrt(1 - y * y), t = ga * i, j = 1 + (Math.random() - .5) * .07;
      P.push([Math.cos(t) * r * j, y * j, Math.sin(t) * r * j]);
    }
    const E = [], seen = new Set();
    P.forEach((a, i) => {
      P.map((b, j) => [j, (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2])
        .filter(([j]) => j !== i).sort((x, y) => x[1] - y[1]).slice(0, 3)
        .forEach(([j]) => { const k = i < j ? i + "-" + j : j + "-" + i; if (!seen.has(k)) { seen.add(k); E.push([i, j]); } });
    });
    const labels = D.globeLabels || [];
    let W = 0, H = 0, rot = 0, raf = 0, on = false, last = 0, hi = -1, label = "", labelT = -1e9, li = 0;

    const resize = () => {
      const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width; H = r.height;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    const project = () => {
      const ca = Math.cos(rot), sa = Math.sin(rot), tl = -.35, ct = Math.cos(tl), st = Math.sin(tl);
      const R = Math.min(W, H) * .38, cx = W / 2, cy = H / 2;
      return P.map(([x, y, z]) => {
        const X = x * ca + z * sa, Z1 = -x * sa + z * ca, Y = y * ct - Z1 * st, Z = y * st + Z1 * ct, f = 3.2 / (3.2 - Z);
        return { x: cx + X * R * f, y: cy - Y * R * f, z: Z, d: (Z + 1) / 2, X, Y };
      });
    };
    const pick = (S, now) => {
      const c = [];
      S.forEach((p, i) => { if (p.z > .45 && p.X > -.6 && p.X < .2 && p.Y > -.4 && p.Y < .5) c.push(i); });
      if (c.length) hi = c[Math.floor(Math.random() * c.length)];
      label = labels.length ? labels[li++ % labels.length] : "";
      labelT = now;
    };
    const draw = now => {
      if (!W || !H) return;
      ctx.clearRect(0, 0, W, H);
      const S = project(), R = Math.min(W, H) * .38, cx = W / 2, cy = H / 2;
      const g = ctx.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.4);
      g.addColorStop(0, "rgba(126,163,223,.11)"); g.addColorStop(1, "rgba(126,163,223,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.32);
      ctx.beginPath(); ctx.ellipse(0, 0, R * 1.42, R * .46, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(126,163,223,.26)"; ctx.lineWidth = 1; ctx.stroke();
      const a = now / 2600;
      ctx.beginPath(); ctx.arc(Math.cos(a) * R * 1.42, Math.sin(a) * R * .46, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = "#da8b68"; ctx.fill(); ctx.restore();

      ctx.lineWidth = .8;
      for (const [i, j] of E) {
        const p = S[i], q = S[j], d = (p.d + q.d) / 2;
        ctx.strokeStyle = `rgba(126,163,223,${(.04 + .55 * d * d).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
      S.forEach((p, i) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, .6 + 1.7 * p.d, 0, Math.PI * 2);
        ctx.fillStyle = i % 4 === 0 ? `rgba(126,163,223,${(.25 + .75 * p.d).toFixed(3)})` : `rgba(233,231,220,${(.1 + .8 * p.d * p.d).toFixed(3)})`;
        ctx.fill();
      });

      if (now - labelT > 4200) pick(S, now);
      const h = S[hi];
      if (h && h.z > .05) {
        ctx.globalAlpha = Math.min(1, (now - labelT) / 400) * Math.min(1, (h.z - .05) / .25);
        ctx.beginPath(); ctx.arc(h.x, h.y, 6.5 + 2.5 * Math.sin(now / 300), 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(218,139,104,.85)"; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(h.x, h.y, 3.2, 0, Math.PI * 2); ctx.fillStyle = "#da8b68"; ctx.fill();
        if (label && W >= 380) {
          ctx.font = "500 11.5px 'IBM Plex Mono', ui-monospace, monospace";
          const bw = ctx.measureText(label).width + 16, bh = 22;
          let bx = h.x - bw - 18, by = h.y - bh - 12;
          if (bx < 4) bx = h.x + 18;
          if (by < 4) by = h.y + 12;
          ctx.beginPath(); ctx.moveTo(bx < h.x ? bx + bw : bx, by + bh / 2); ctx.lineTo(h.x, h.y);
          ctx.strokeStyle = "rgba(218,139,104,.35)"; ctx.lineWidth = 1; ctx.stroke();
          ctx.fillStyle = "rgba(17,21,27,.9)"; ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = "rgba(218,139,104,.55)"; ctx.strokeRect(bx + .5, by + .5, bw - 1, bh - 1);
          ctx.fillStyle = "#e7a585"; ctx.textBaseline = "middle"; ctx.fillText(label, bx + 8, by + bh / 2 + .5);
        }
        ctx.globalAlpha = 1;
      }
    };
    const loop = now => {
      const dt = Math.min(50, now - (last || now)); last = now;
      rot += dt * .00018; draw(now);
      raf = requestAnimationFrame(loop);
    };
    addEventListener("resize", () => { if (on || reduce) { resize(); if (reduce) draw(performance.now()); } });
    return {
      toggle(v) {
        if (reduce) { if (v) { resize(); draw(performance.now()); } return; }
        if (v && !on) { on = true; last = 0; resize(); raf = requestAnimationFrame(loop); }
        else if (!v && on) { on = false; cancelAnimationFrame(raf); }
      }
    };
  })($("#globe"));

  /* ---------- router (#home, #experience, …) ---------- */
  const go = (id, focus) => {
    const page = PAGES.find(p => p.id === id) || PAGES[0];
    $$(".page").forEach(s => { s.hidden = s.dataset.page !== page.id; });
    $$("[data-link]").forEach(a => a.dataset.link === page.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    document.title = page.id === "home" ? `${D.name} — ${D.role}` : `${page.title} — ${D.name}`;
    window.scrollTo(0, 0);
    if (globe) globe.toggle(page.id === "home");
    closeMenu();
    if (focus) { const h = $(`#page-${page.id} h1, #page-${page.id} h2`); if (h) h.focus({ preventScroll: true }); }
  };
  addEventListener("hashchange", () => go(location.hash.slice(1), true));
  go(location.hash.slice(1) || "home", false);
})();
</script>
</body>
